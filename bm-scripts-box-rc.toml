[bmscriptsbox]

[bmscriptsbox.info]
id = "92c926c7-7450-4503-bbaa-2a5b635eedd7"
name = "图片格式转换"
desc = "图片格式转换python脚本、将图片转换为 PNG / JPEG / WEBP / BMP / GIF / ICO / TIFF 格式，支持自定义输出位置"
version = "1.1.5"

[bmscriptsbox.runtime]
language = "python"
language_version = ">=3.8"
entry = "main.py"
terminal = "never"

[bmscriptsbox.triggers.context_menu]
enabled = true
targets = ["files"]
filters = [".png", ".jpg", ".jpeg", ".webp", ".bmp", ".gif", ".ico", ".tiff", ".tif"]

[bmscriptsbox.triggers.shortcut]
enabled = true
input_type = "files"
filters = [".png", ".jpg", ".jpeg", ".webp", ".bmp", ".gif", ".ico", ".tiff", ".tif"]

[[bmscriptsbox.inputs]]
name = "target_paths"
type = "file"
exts = [".png", ".jpg", ".jpeg", ".webp", ".bmp", ".gif", ".ico", ".tiff", ".tif"]



